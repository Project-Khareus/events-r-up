<mjml>
  <mj-head>
    <mj-title>Khareus bug review update</mj-title>
    <mj-preview>A bug review is ready for your attention.</mj-preview>
    <mj-attributes>
      <mj-all font-family="Jost, Helvetica, Arial, sans-serif" />
      <mj-section background-color="#fcf8f4" padding="0 36px" />
      <mj-column padding="0" />
      <mj-text color="#3b322b" font-size="15px" line-height="1.6" padding="0" />
      <mj-button background-color="#8a6522" color="#ffffff" border-radius="0px" font-size="15px" font-weight="700" inner-padding="14px 28px" padding="0" align="left" />
      <mj-image padding="0" />
      <mj-class name="h" font-family="'Cormorant Garamond', Georgia, serif" font-weight="700" />
      <mj-class name="label" font-size="11px" letter-spacing="2px" text-transform="uppercase" font-weight="700" color="#8a6522" />
      <mj-class name="muted" color="#3b322b" />
    </mj-attributes>
  </mj-head>
  <mj-body background-color="#ffffff" width="600px">
    <mj-wrapper padding="28px 12px" background-color="#ffffff">
      <mj-section background-color="#8a6522" padding="24px 36px"><mj-column>
        <mj-image src="https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/69224d81efa2f499554b5019/7f8180ec6_khareus.png" alt="Khareus" width="40px" align="center" padding="0 0 12px" />
        <mj-text align="center" font-size="12px" letter-spacing="4px" font-weight="700" color="#ffffff">KHAREUS</mj-text>
      </mj-column></mj-section>
      <mj-section padding="40px 36px 8px"><mj-column>
        <mj-text mj-class="h" font-size="30px" line-height="1.2" padding="0 0 10px">Your bug review is ready.</mj-text>
        <mj-text mj-class="muted">Here is the agent's assessment based on the evidence available.</mj-text>
      </mj-column></mj-section>
      <mj-section padding="24px 36px 0"><mj-column background-color="#f3ece3" padding="16px 20px 12px"><mj-text mj-class="label">Reported issue</mj-text><mj-text padding="8px 0 0">{{report}}</mj-text></mj-column></mj-section>
      <mj-section padding="0 36px"><mj-column background-color="#f3ece3" padding="12px 20px"><mj-text mj-class="label">Assessment</mj-text><mj-text padding="8px 0 0">{{verdict}}</mj-text><mj-text padding="8px 0 0">{{evidence}}</mj-text></mj-column></mj-section>
      <mj-section padding="0 36px 28px"><mj-column background-color="#f3ece3" padding="14px 20px 18px"><mj-text mj-class="label">Next steps</mj-text><mj-text padding="8px 0 0">{{next_steps}}</mj-text></mj-column></mj-section>
      <mj-section padding="0 36px 40px"><mj-column><mj-button href="https://eventsrup.com/AdminBugReviewer">Open bug reviewer</mj-button></mj-column></mj-section>
      <mj-section background-color="#8a6522" padding="26px 36px 30px"><mj-column><mj-text mj-class="h" align="center" font-size="17px" color="#ffffff">Khareus</mj-text></mj-column></mj-section>
    </mj-wrapper>
  </mj-body>
</mjml>
